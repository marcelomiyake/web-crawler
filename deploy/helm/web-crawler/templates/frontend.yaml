apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-crawler-frontend
  labels:
    {{- include "web-crawler.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.services.frontend.replicas }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "web-crawler.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "web-crawler.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.services.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
          volumeMounts:
            - { name: nginx-runtime, mountPath: /var/cache/nginx }
            - { name: nginx-tmp, mountPath: /tmp }
            - { name: nginx-run, mountPath: /var/run }
      volumes:
        - { name: nginx-runtime, emptyDir: {} }
        - { name: nginx-tmp, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web-crawler-frontend
  labels:
    {{- include "web-crawler.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "web-crawler.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
